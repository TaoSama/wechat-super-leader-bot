name: Verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: ${{ matrix.os }} / ${{ matrix.suite }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            suite: unit
          - os: ubuntu-24.04
            suite: integration
          - os: macos-14
            suite: unit
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.8.0
          run_install: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: |
            controller/pnpm-lock.yaml
            gateway/pnpm-lock.yaml
            web/pnpm-lock.yaml
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: daemon/go.mod
          cache-dependency-path: daemon/go.sum
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: deploy/skills/web-content-fetcher/requirements.txt
      - name: Configure Codex bubblewrap AppArmor profile
        if: matrix.os == 'ubuntu-24.04' && matrix.suite == 'integration'
        run: |
          sudo apt-get update
          sudo env NEEDRESTART_MODE=l apt-get install --yes --no-install-recommends apparmor-profiles apparmor-utils bubblewrap
          sudo install -m 0644 /usr/share/apparmor/extra-profiles/bwrap-userns-restrict /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          bwrap --version
          bwrap --unshare-user --unshare-net --ro-bind / / --proc /proc --dev /dev /bin/true
      - name: Install locked dependencies
        run: |
          pnpm --dir controller install --frozen-lockfile
          pnpm --dir gateway install --frozen-lockfile
          pnpm --dir web install --frozen-lockfile
      - name: Install webpage extraction test dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/web-content-fetcher-venv"
          "$RUNNER_TEMP/web-content-fetcher-venv/bin/python" -m pip install --disable-pip-version-check -r deploy/skills/web-content-fetcher/requirements.txt
          echo "$RUNNER_TEMP/web-content-fetcher-venv/bin" >> "$GITHUB_PATH"
      - name: Verify with synthetic fixtures
        env:
          SUPER_LEADER_SKIP_NATIVE_PROGRESS: ${{ matrix.os == 'ubuntu-24.04' && matrix.suite == 'integration' && '1' || '' }}
        run: node scripts/verify.mjs --suite ${{ matrix.suite }} --parallel
      - name: Verify native app-server steering
        if: matrix.os == 'macos-14'
        run: node tests/integration/leader/progress-steering.mjs --run
