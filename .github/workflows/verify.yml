name: Verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: ${{ matrix.os }} / ${{ matrix.suite }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            suite: all
          - os: macos-14
            suite: unit
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: daemon/go.mod
          cache-dependency-path: daemon/go.sum
      - name: Install fixed package manager
        run: npm install --global pnpm@11.8.0
      - name: Install locked dependencies
        run: |
          pnpm --dir controller install --frozen-lockfile
          pnpm --dir gateway install --frozen-lockfile
          pnpm --dir web install --frozen-lockfile
      - name: Verify with synthetic fixtures
        run: node scripts/verify.mjs --suite ${{ matrix.suite }}
