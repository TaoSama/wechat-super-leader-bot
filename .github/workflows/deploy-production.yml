name: Deploy production

# A merged pull request is the deployment boundary. Using pull_request_target
# avoids relying on a push emitted by an Actions token, which GitHub suppresses
# from triggering another workflow.
on:
  pull_request_target:
    types: [closed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REVISION: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
  CONTROLLER_IMAGE: super-leader-controller:${{ github.event.pull_request.merge_commit_sha || github.sha }}
  GATEWAY_IMAGE: super-leader-gateway:${{ github.event.pull_request.merge_commit_sha || github.sha }}

jobs:
  build-and-deploy:
    name: Build and deploy linux/amd64 images
    if: >-
      ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'pull_request_target' &&
           github.event.pull_request.merged == true &&
           github.event.pull_request.base.ref == github.event.repository.default_branch) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.DEPLOY_URL }}
    steps:
      - name: Check out the merged revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: ${{ env.REVISION }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Validate production deployment inputs
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          set -Eeuo pipefail
          : "${DEPLOY_HOST:?production secret DEPLOY_HOST is required}"
          : "${DEPLOY_USER:?production secret DEPLOY_USER is required}"
          : "${DEPLOY_SSH_PRIVATE_KEY:?production secret DEPLOY_SSH_PRIVATE_KEY is required}"
          : "${DEPLOY_KNOWN_HOSTS:?production secret DEPLOY_KNOWN_HOSTS is required}"
          : "${DEPLOY_PATH:?production variable DEPLOY_PATH is required}"
          [[ "$REVISION" =~ ^[0-9a-f]{40}$ ]] || { echo 'deployment revision must be a full commit SHA' >&2; exit 1; }
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]] || { echo 'DEPLOY_PATH must be an absolute path without shell metacharacters' >&2; exit 1; }
          deploy_port="${DEPLOY_PORT:-22}"
          [[ "$deploy_port" =~ ^[0-9]+$ && deploy_port -ge 1 && deploy_port -le 65535 ]] || { echo 'DEPLOY_PORT must be a TCP port' >&2; exit 1; }

      - name: Build controller and Gateway archives in parallel
        env:
          BUILDKIT_PROGRESS: auto
        run: |
          set -Eeuo pipefail
          release_root="$RUNNER_TEMP/super-leader-release-$REVISION"
          mkdir -p "$release_root"
          cp compose.yaml "$release_root/compose.yaml"
          cp deploy/compose.release.yaml "$release_root/compose.release.yaml"
          cp deploy/compose.production.yaml "$release_root/compose.production.yaml"
          cp deploy/compose.gateway.yaml "$release_root/compose.gateway.yaml"
          cp deploy/security/codex-seccomp.json "$release_root/codex-seccomp.json"
          cp scripts/deploy/remote-release.sh "$release_root/remote-release.sh"

          build_image() {
            local component="$1" dockerfile="$2" image="$3" archive="$4" log_file="$5"
            set +e
            docker buildx build \
              --platform linux/amd64 \
              --build-arg VCS_REF="$REVISION" \
              --tag "$image" \
              --cache-from "type=gha,scope=$component" \
              --cache-to "type=gha,scope=$component,mode=max" \
              --provenance=false \
              --sbom=false \
              --output "type=docker,dest=$archive" \
              --file "$dockerfile" . >"$log_file" 2>&1
            local status=$?
            set -e
            if (( status != 0 )); then
              echo "[$component] build failed; last 200 log lines:" >&2
              tail -n 200 "$log_file" >&2
              return "$status"
            fi
            echo "[$component] build completed ($(wc -l <"$log_file") log lines)"
          }

          build_image controller deploy/Dockerfile.controller "$CONTROLLER_IMAGE" \
            "$release_root/controller.tar" "$release_root/controller-build.log" &
          controller_pid=$!
          build_image gateway deploy/Dockerfile.gateway "$GATEWAY_IMAGE" \
            "$release_root/gateway.tar" "$release_root/gateway-build.log" &
          gateway_pid=$!
          status=0
          wait "$controller_pid" || status=1
          wait "$gateway_pid" || status=1
          (( status == 0 )) || exit "$status"

          docker load --input "$release_root/controller.tar" >/dev/null
          docker load --input "$release_root/gateway.tar" >/dev/null
          for pair in "controller:$CONTROLLER_IMAGE" "gateway:$GATEWAY_IMAGE"; do
            component="${pair%%:*}"
            image="${pair#*:}"
            platform="$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$image")"
            image_revision="$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image")"
            [[ "$platform" == linux/amd64 ]] || { echo "$component image platform is $platform" >&2; exit 1; }
            [[ "$image_revision" == "$REVISION" ]] || { echo "$component image revision is $image_revision" >&2; exit 1; }
            printf 'component=%s image=%s platform=%s revision=%s\n' "$component" "$image" "$platform" "$image_revision" \
              | tee -a "$release_root/image-metadata.txt"
          done
          (
            cd "$release_root"
            sha256sum controller.tar gateway.tar compose.yaml compose.release.yaml compose.production.yaml compose.gateway.yaml codex-seccomp.json > release.sha256
          )
          printf 'REVISION=%s\nCONTROLLER_IMAGE=%s\nGATEWAY_IMAGE=%s\n' "$REVISION" "$CONTROLLER_IMAGE" "$GATEWAY_IMAGE" \
            > "$release_root/manifest.env"

      - name: Transfer and activate the release on the VPS
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          DEPLOY_ENV_FILE: ${{ vars.DEPLOY_ENV_FILE }}
        run: |
          set -Eeuo pipefail
          release_root="$RUNNER_TEMP/super-leader-release-$REVISION"
          deploy_port="${DEPLOY_PORT:-22}"
          env_file="${DEPLOY_ENV_FILE:-.runtime/controller.env}"
          key_file="$RUNNER_TEMP/deploy-key"
          known_hosts_file="$RUNNER_TEMP/deploy-known-hosts"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$key_file"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$known_hosts_file"
          chmod 600 "$key_file" "$known_hosts_file"
          ssh_opts=(-i "$key_file" -p "$deploy_port" -o BatchMode=yes -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$known_hosts_file" -o LogLevel=ERROR)
          scp_opts=(-i "$key_file" -P "$deploy_port" -o BatchMode=yes -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$known_hosts_file" -o LogLevel=ERROR)
          target="$DEPLOY_USER@$DEPLOY_HOST"
          remote_stage="$DEPLOY_PATH/.runtime/releases/$REVISION"
          ssh "${ssh_opts[@]}" "$target" "umask 077; mkdir -p '$remote_stage'"
          scp -q "${scp_opts[@]}" \
            "$release_root/controller.tar" "$release_root/gateway.tar" "$release_root/release.sha256" \
            "$release_root/manifest.env" "$release_root/compose.release.yaml" "$release_root/compose.yaml" \
            "$release_root/compose.production.yaml" "$release_root/compose.gateway.yaml" \
            "$release_root/codex-seccomp.json" "$release_root/remote-release.sh" \
            "$target:$remote_stage/"
          ssh "${ssh_opts[@]}" "$target" "chmod 700 '$remote_stage/remote-release.sh'"

          printf -v remote_command '%q ' \
            "$remote_stage/remote-release.sh" \
            --release-dir "$DEPLOY_PATH" --stage-dir "$remote_stage" --revision "$REVISION" \
            --controller-image "$CONTROLLER_IMAGE" --gateway-image "$GATEWAY_IMAGE" \
            --controller-archive "$remote_stage/controller.tar" --gateway-archive "$remote_stage/gateway.tar" \
            --checksums "$remote_stage/release.sha256" --compose-overlay "$remote_stage/compose.release.yaml" \
            --compose-base "$remote_stage/compose.yaml" \
            --compose-production "$remote_stage/compose.production.yaml" \
            --compose-gateway "$remote_stage/compose.gateway.yaml" \
            --seccomp-policy "$remote_stage/codex-seccomp.json" \
            --env-file "$env_file"
          ssh "${ssh_opts[@]}" "$target" "$remote_command"

      - name: Retain bounded build diagnostics on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-deploy-diagnostics-${{ env.REVISION }}
          path: ${{ runner.temp }}/super-leader-release-${{ env.REVISION }}/*.log
          if-no-files-found: warn
          retention-days: 7
