map $http_upgrade $super_leader_connection_upgrade {
    default upgrade;
    '' close;
}

limit_req_zone $binary_remote_addr zone=super_leader_api:10m rate=10r/s;

server {
    listen 80;
    server_name leader.example.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/super-leader-acme;
        default_type text/plain;
    }

    location / {
        return 308 https://leader.example.com$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name leader.example.com;
    ssl_certificate /etc/letsencrypt/live/leader.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/leader.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:super_leader_tls:10m;
    ssl_session_timeout 1d;

    client_max_body_size 1m;
    # Do not log query strings, credentials or conversation bodies.
    access_log off;
    error_log /var/log/nginx/super-leader-error.log warn;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control no-store always;

    location / {
        limit_req zone=super_leader_api burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $super_leader_connection_upgrade;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 30s;
        proxy_buffering off;
    }
}
