services:
  postgres:
    mem_limit: 256m
    cpus: 0.50
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
  controller:
    environment:
      CONSOLE_PUBLIC_URL: ${CONSOLE_PUBLIC_URL:-https://leader.taoai.site}
      BACKGROUND_WORKER_ROOT: ${BACKGROUND_WORKER_ROOT:-}
      BACKGROUND_ARTIFACT_ROOT: /var/lib/super-leader-artifacts
      BACKGROUND_MAX_CONCURRENT: ${BACKGROUND_MAX_CONCURRENT:-2}
      BACKGROUND_TURN_TIMEOUT_MS: ${BACKGROUND_TURN_TIMEOUT_MS:-600000}
    volumes:
      - background-workers:/var/lib/super-leader-background
      - background-artifacts:/var/lib/super-leader-artifacts
    user: "1000:1000"
    init: true
    mem_limit: ${CONTROLLER_MEMORY_LIMIT:-1536m}
    cpus: 2.0
    pids_limit: 512
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - seccomp:./deploy/security/codex-seccomp.json
      - apparmor:super-leader-codex
    tmpfs: ["/tmp:size=64m,mode=1777"]
    stop_grace_period: 30s
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8790/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
volumes:
  background-workers:
    name: ${BACKGROUND_WORKER_VOLUME:-super-leader-background-workers}
  background-artifacts:
    name: ${BACKGROUND_ARTIFACT_VOLUME:-super-leader-background-artifacts}
