services:
  postgres:
    mem_limit: 256m
    cpus: 0.50
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
  controller:
    environment:
      CONSOLE_PUBLIC_URL: ${CONSOLE_PUBLIC_URL:-https://leader.example.com}
    mem_limit: 512m
    cpus: 0.75
    pids_limit: 128
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=16m,mode=1777"]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8790/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
