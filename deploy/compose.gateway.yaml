services:
  gateway:
    profiles: [wechat]
    build:
      context: .
      dockerfile: deploy/Dockerfile.gateway
    image: super-leader-gateway:latest
    container_name: super-leader-gateway
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - seccomp=./deploy/security/codex-seccomp.json
      - apparmor=super-leader-codex
    mem_limit: 1g
    cpus: 1
    pids_limit: 256
    stop_grace_period: 1200s
    init: true
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    environment:
      CONTROLLER_URL: ${CONTROLLER_URL:-https://leader.example.com}
      CONTROLLER_TOKEN: ${CONTROLLER_TOKEN:?set CONTROLLER_TOKEN}
      WECHAT_CREDENTIALS_PATH: /etc/super-leader/wechat-account.json
      WECHAT_STATE_PATH: /var/lib/super-leader-gateway/state.json
      GATEWAY_HEALTH_PATH: /var/lib/super-leader-gateway/health.json
      GATEWAY_MAX_CHARS: ${GATEWAY_MAX_CHARS:-3800}
      GATEWAY_CONTEXT_WINDOW_MS: ${GATEWAY_CONTEXT_WINDOW_MS:-82800000}
      GATEWAY_SEND_BUDGET: ${GATEWAY_SEND_BUDGET:-10}
      GATEWAY_OUTBOX_LIMIT: ${GATEWAY_OUTBOX_LIMIT:-1000}
      GATEWAY_POLL_TIMEOUT_MS: ${GATEWAY_POLL_TIMEOUT_MS:-35000}
      GATEWAY_LEADER_MODE: ${GATEWAY_LEADER_MODE:-codex}
      GATEWAY_LEADER_ROOT: /var/lib/super-leader-gateway/leader
      GATEWAY_LEADER_MODEL: ${GATEWAY_LEADER_MODEL:-gpt-6.1-sol}
      GATEWAY_LEADER_BASE_URL: ${GATEWAY_LEADER_BASE_URL:-${LEADER_MODEL_BASE_URL:-}}
      GATEWAY_LEADER_API_KEY: ${GATEWAY_LEADER_API_KEY:-${LEADER_MODEL_API_KEY:-}}
      RESULT_FILE_MAX_BYTES: ${RESULT_FILE_MAX_BYTES:-52428800}
      RESULT_PUBLIC_ORIGIN: ${RESULT_PUBLIC_ORIGIN:-${CONSOLE_PUBLIC_URL:-https://leader.example.com}}
    volumes:
      - type: bind
        source: ${WECHAT_ACCOUNT_FILE:-.runtime/wechat/account.json}
        target: /etc/super-leader/wechat-account.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${WECHAT_STATE_DIR:-.runtime/wechat/state}
        target: /var/lib/super-leader-gateway
        bind:
          create_host_path: false
    tmpfs: ["/tmp:size=64m,mode=1777"]
    healthcheck:
      test: [CMD, node, dist/index.js, --healthcheck]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
