services:
  gateway:
    profiles: [wechat]
    build:
      context: .
      dockerfile: deploy/Dockerfile.gateway
    image: super-leader-gateway:latest
    container_name: super-leader-gateway
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 0.25
    pids_limit: 128
    stop_grace_period: 600s
    init: true
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    environment:
      CONTROLLER_URL: ${CONTROLLER_URL:-https://leader.taoai.site}
      CONTROLLER_TOKEN: ${CONTROLLER_TOKEN:?set CONTROLLER_TOKEN}
      WECHAT_CREDENTIALS_PATH: /etc/super-leader/wechat-account.json
      WECHAT_STATE_PATH: /var/lib/super-leader-gateway/state.json
      GATEWAY_HEALTH_PATH: /var/lib/super-leader-gateway/health.json
      GATEWAY_NOTIFICATIONS: ${GATEWAY_NOTIFICATIONS:-false}
    volumes:
      - type: bind
        source: ${WECHAT_ACCOUNT_FILE:-.runtime/wechat/account.json}
        target: /etc/super-leader/wechat-account.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${WECHAT_STATE_DIR:-.runtime/wechat/state}
        target: /var/lib/super-leader-gateway
        bind:
          create_host_path: false
    tmpfs: ["/tmp:size=16m,mode=1777"]
    healthcheck:
      test: [CMD, node, dist/index.js, --healthcheck]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
